<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UzGuide – Verification Code</title>
  <style>
    body {
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .wrap {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 32px;
      border: 1px solid #e5e7eb;
    }
    h1 {
      font-size: 22px;
      color: #1d4ed8;
      text-align: center;
      margin: 0 0 20px;
    }
    p {
      font-size: 16px;
      color: #111827;
      margin: 16px 0;
      line-height: 1.5;
    }
    .code-box {
      text-align: center;
      margin: 32px 0;
    }
    .code {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 4px;
      padding: 16px 32px;
      border: 1px dashed #1d4ed8;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 6px;
      display: inline-block;
    }
    .small {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>UzGuide Verification</h1>
    <p>Hello,</p>
    <p>Please enter the verification code below to confirm your email address:</p>

    <div class="code-box">
      <div class="code">{{ code }}</div>
    </div>

    <p>This code will expire in <strong>{{ expires_in_seconds }} seconds</strong>.</p>
    <p>If you did not request this code, you can safely ignore this message.</p>

    <div class="small">© 2025 UzGuide. All rights reserved.</div>
  </div>
</body>
</html>

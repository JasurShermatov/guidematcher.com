x-env: &default-env
  env_file:
    - .env

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /var/lib/postgresql/backups:/backups
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network


  bot_db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./bot/.env
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Healthcheck: redis-cli ping (image ichida bor)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  backend:
    build: .
    <<: *default-env
    restart: always
    entrypoint: /entrypoint.sh
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
      - "587:587"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sSf http://localhost:8000/health/ > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  bot:
    build:
      context: ./bot
      dockerfile: DockerfileBot
    env_file:
      - ./bot/.env
    restart: always
    depends_on:
      bot_db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./bot:/app

  celery:
    build: .
    <<: *default-env
    restart: always
    entrypoint: ""
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network

    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery.*worker' >/dev/null" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend/travel-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api/v1/}
        - REACT_APP_WS_ORIGIN=${REACT_APP_WS_ORIGIN:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

    healthcheck:
      test: [ "CMD-SHELL", "curl -sSf http://localhost/ >/dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: uzguide-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_data:/app/staticfiles
      - media_data:/app/media
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  static_data:
  media_data:
  bot_postgres_data:

networks:
  app-network:
    driver: bridge

x-env: &default-env
  env_file:
    - .env

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  backend:
    build: .
    <<: *default-env
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  bot:
    build:
      context: ./bot
      dockerfile: DockerfileBot
    env_file:
      - .env
    restart: always
    volumes:
      - ./bot:/app
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  celery:
    build: .
    <<: *default-env
    restart: unless-stopped
    entrypoint: ""
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/travel-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api/v1/}
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  app-network:
    driver: bridge
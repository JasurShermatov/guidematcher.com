
# docker-compose.yml
=======
# ◀️  “version:” kaliti keraksiz – Compose v2+ da avtomatik aniqlanadi

x-env: &default-env
  env_file:
    - .env

services:
  # ───────────── Database ─────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  # ───────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ───────────── Django / ASGI ────────
  backend:
    build: .
    <<: *default-env
    restart: unless-stopped

    entrypoint: /entrypoint.sh

    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8000:8000"
      - "587:587"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Django health: settings'da simple view (`/health/`) yoki manage.py check
      test: [ "CMD-SHELL", "curl -sSf http://localhost:8000/health/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: DockerfileBot
    env_file:
      - .env
    restart: always
    volumes:
      - .:/bot
    depends_on:
      backend:
        condition: service_healthy


  # ───────────── Celery worker ────────
  celery:
    build: .
    <<: *default-env
    restart: unless-stopped
    entrypoint: ""
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  # ───────────── Celery Beat ──────────
  celery-beat:
    build: .
    <<: *default-env
    restart: unless-stopped
    entrypoint: ""

    command: celery -A config beat -l info

    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend/travel-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api/v1/}
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  static_data:
  media_data:

x-env: &default-env
  env_file:
    - .env

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-network

  bot_db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./bot/.env
    volumes:
      - bot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build: .
    <<: *default-env
    restart: always
    entrypoint: /entrypoint.sh
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
      - "587:587"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  bot:
    build:
      context: ./bot
      dockerfile: DockerfileBot   # <-- MUHIM: DockerfileBot ni ko'rsatdik
    env_file:
      - ./bot/.env
    restart: always
    depends_on:
      bot_db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./bot:/app

  celery:
    build: .
    <<: *default-env
    restart: unless-stopped
    entrypoint: ""
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/travel-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api/v1/}
        - REACT_APP_WS_ORIGIN=${REACT_APP_WS_ORIGIN:-ws://localhost:8000}
        - REACT_APP_API_URL=/api/v1/
        - REACT_APP_WS_ORIGIN=/ws/
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf
      - static_data:/var/www/static
      - ./media:/var/www/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:
  static_data:
  media_data:
  bot_postgres_data:

networks:
  app-network:
    driver: bridge

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # React Router uchun SPA routing (barcha yo'llar index.html ga)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static fayllar (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy (ixtiyoriy: agar frontend dan backend ga proxy kerak bo'lsa)
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # CORS headerlar ham qo‘shilgan, lekin same-origin bo‘lsak ularsiz ham ishlaydi
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }


    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
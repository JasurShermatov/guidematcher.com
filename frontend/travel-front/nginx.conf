server {
    listen 80;
    server_name uzguide.com www.uzguide.com;

    # React build
    root /usr/share/nginx/html;
    index index.html;

    # --- MEDIA: Django'dan proxylash (avatarlar shu yerda) ---
    # MUHIM: Bu blok regex statik blokdan YUQORIDA turishi shart
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Avatarda agressiv cache shart emas
        add_header Cache-Control "public, max-age=300";
    }

    # (ixtiyoriy) Django static kerak bo'lsa
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- API proxy (Django) ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Statik assetlar (React build fayllari) ---
    # DIQQAT: /media/ va /static/ proxylari YUQORIDA tursin!
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html ni cachelamang
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

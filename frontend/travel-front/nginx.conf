server {
    listen 80;
    server_name uzguide.com www.uzguide.com;

    # React build (SPA)
    root /usr/share/nginx/html;
    index index.html;

    # --- MEDIA: Django'dan proxylash (avatarlar shu yerda saqlanadi) ---
    # DIQQAT: regex statik blokdan YUQORIDA turishi kerak
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300";
    }

    # (ixtiyoriy) Django static
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }

    # ➊ Faqat CLIENT AVATAR upload uchun 5MB limit
    #   Mos keladigan URL: /api/v1/profiles/clients/<uuid>/avatar/  (GET/POST)
    #   UUID: 36 belgili 0-9a-f va '-'
    location ~* ^/api/v1/profiles/clients/[0-9a-f-]{36}/avatar/?$ {
        client_max_body_size 5m;          # <-- faqat shu endpoint uchun
        proxy_pass http://backend:8000;   # to‘liq URI saqlansin (rewritesiz)
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (ixtiyoriy) katta fayllarni stream qilish uchun:
        # proxy_request_buffering off;
    }

    # ➋ Qolgan API — umumiy 20MB limit
    location /api/ {
        client_max_body_size 7m;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Statik assetlar (React build fayllari) ---
    # DIQQAT: /media/ va /static/ proxylari YUQORIDA tursin!
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html ni cachelamang
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
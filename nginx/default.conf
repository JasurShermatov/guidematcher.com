# ------------------------------
# HTTP → HTTPS redirect
# ------------------------------
server {
    listen 80;
    server_name uzguide.com www.uzguide.com;
    return 301 https://$host$request_uri;
    access_log off;
    error_log /var/log/nginx/http_error.log;
}

# ------------------------------
# HTTPS server (Main)
# ------------------------------
server {
    listen 443 ssl;
    server_name uzguide.com www.uzguide.com;
    http2 on;

    # --------------------------
    # SSL certificates
    # --------------------------
    ssl_certificate /etc/letsencrypt/live/uzguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzguide.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------
    # General & Security
    # --------------------------
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Block access to hidden/sensitive files
    location ~ /\.(?!well-known) {
        return 444;
    }

    location ~* /(\\.git|\\.svn|\\.hg|\\.bzr|\\.DS_Store|\\.env|composer\\.(json|lock)|package-lock\\.json|yarn\\.lock|\\.bak|\\.old|\\.swp)$ {
        return 444;
    }

    # --------------------------
    # Let's Encrypt challenge
    # --------------------------
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location ^~ /.well-known/ {
        return 404;
    }

    # --------------------------
    # Health check endpoint
    # --------------------------
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------
    # Django backend (API)
    # --------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
    }

    # --------------------------
    # Static & Media
    # --------------------------
    location /static/ {
        alias /var/www/static/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }

    # --------------------------
    # Frontend (React build)
    # --------------------------
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # --------------------------
    # GZIP optimization
    # --------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;

    # --------------------------
    # Logging
    # --------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
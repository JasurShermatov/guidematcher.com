server {
    listen 80;
    server_name uzguide.com www.uzguide.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name www.uzguide.com uzguide.com;

    ssl_certificate /etc/letsencrypt/live/uzguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzguide.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 5m;
    client_body_timeout  20s;
    client_header_timeout 20s;
    send_timeout         20s;
    keepalive_timeout    65s;

    location ~ /\.(?!well-known) {
        return 444;
    }

    location ~* /(\\.git|\\.svn|\\.hg|\\.bzr|\\.DS_Store|\\.htaccess|\\.env|composer\\.(json|lock)|package-lock\\.json|yarn\\.lock|\\.backup|\\.bak|\\.old|\\.swp)$ {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location ^~ /.well-known/ {
        return 404;
    }

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API routes - handle these first
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased timeouts for better stability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        # Better error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        # Better error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;

        # Error page for when frontend is down
        error_page 502 503 504 /50x.html;
    }

    location /media/ {
        alias /var/www/media/;         # points to media_data volume
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }

    location /django-static/ {
        alias /var/www/static/;        # points to static_data volume
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
}
server {
    listen 80;
    server_name localhost;

    # React (frontend) — o‘zgarmaydi
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → Django (Daphne) — o‘zgarmaydi (faqat timeouts qo‘shildi)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
    }

    # (ixtiyoriy, lekin tavsiya) WebSocket → Channels
    # Bo‘lsa ishlaydi, bo‘lmasa zarar qilmaydi
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # Django static (STATIC_ROOT → staticfiles) — o‘zgarmaydi
    location /django-static/ {
        alias /var/www/static/;         # static_data volume
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # YANGI: Media fayllar (avatarlar, uploadlar) — PROXY EMAS, ALIAS!
    location /media/ {
        alias /var/www/media/;          # nginx konteynerida shu yo‘l mount bo‘ladi
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # (ixtiyoriy) Katta uploadlar uchun
    client_max_body_size 20m;
}

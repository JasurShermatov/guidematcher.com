# Rate limiting zones - ADD THIS BEFORE server blocks
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# Bad bot blocking map - ADD THIS TOO
map $http_user_agent $bad_bot {
    default 0;
    ~*bot 1;
    ~*spider 1;
    ~*crawler 1;
    ~*scrapy 1;
    ~*python 1;
    ~*curl 1;
    ~*wget 1;
    "" 1;  # Empty user agent
}

server {
    listen 80;
    server_name uzguide.com www.uzguide.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name uzguide.com www.uzguide.com;

    ssl_certificate /etc/letsencrypt/live/uzguide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzguide.com/privkey.pem;

    # PROTECTION SETTINGS - ADD THESE
    client_max_body_size 40M;
    limit_conn conn_limit_per_ip 15;  # Max 15 connections per IP

    # Block bad bots
    if ($bad_bot) {
        return 444;  # Drop connection without response
    }

    # Block requests without proper headers
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # Static files - high rate limit (images, CSS, JS)
    location /django-static/ {
        limit_req zone=static burst=100 nodelay;
        alias /app/staticfiles/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location /media/ {
        limit_req zone=static burst=100 nodelay;
        alias /app/media/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # API endpoints - strict rate limiting
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Additional security headers
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Frontend - moderate rate limiting
    location / {
        limit_req zone=general burst=10 nodelay;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}